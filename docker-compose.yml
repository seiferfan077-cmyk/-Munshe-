services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-munshe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-munshe}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-munshe} -d ${POSTGRES_DB:-munshe}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-munshe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-munshe}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_DIR: /data
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    ports: ["${API_PORT:-4000}:4000"]
    volumes: [build_data:/data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-munshe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-munshe}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_DIR: /data
    volumes: [build_data:/data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  build_data:
