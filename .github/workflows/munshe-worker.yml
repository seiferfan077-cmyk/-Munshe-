name: Munshe Android APK Build

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "رابط HTTPS مباشر لملف ZIP الخاص بمشروع React Native"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: munshe-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Download, build, and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate and download project ZIP
        env:
          PROJECT_URL: ${{ inputs.project_url }}
        run: |
          set -euo pipefail

          if [[ ! "$PROJECT_URL" =~ ^https:// ]]; then
            echo "::error::يجب أن يبدأ رابط المشروع بـ https://"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/munshe_app"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "$PROJECT_URL" \
            --output "$RUNNER_TEMP/munshe-project.zip"

          if [[ ! -s "$RUNNER_TEMP/munshe-project.zip" ]]; then
            echo "::error::تم تنزيل ملف فارغ."
            exit 1
          fi

          if ! unzip -tq "$RUNNER_TEMP/munshe-project.zip"; then
            echo "::error::الرابط لا يحتوي على ملف ZIP صالح."
            exit 1
          fi

          unzip -q "$RUNNER_TEMP/munshe-project.zip" \
            -d "$GITHUB_WORKSPACE/munshe_app"

      - name: Locate React Native Android project
        id: locate-project
        run: |
          set -euo pipefail

          PROJECT_ROOT="$GITHUB_WORKSPACE/munshe_app"
          FOUND_PROJECT=""

          while IFS= read -r -d '' PACKAGE_JSON; do
            CANDIDATE_DIR="$(dirname "$PACKAGE_JSON")"

            if [[ -f "$CANDIDATE_DIR/android/gradlew" ]]; then
              FOUND_PROJECT="$CANDIDATE_DIR"
              break
            fi
          done < <(
            find "$PROJECT_ROOT" \
              -type d -name node_modules -prune -o \
              -type f -name package.json -print0
          )

          if [[ -z "$FOUND_PROJECT" ]]; then
            echo "::error::لم أجد مشروع React Native يحتوي package.json و android/gradlew داخل ملف ZIP."
            echo "تأكد أن ملف ZIP يحتوي مشروع React Native CLI وليس مشروع Expo مُدارًا فقط."
            exit 1
          fi

          if [[ ! -f "$FOUND_PROJECT/android/app/build.gradle" ]] && \
             [[ ! -f "$FOUND_PROJECT/android/app/build.gradle.kts" ]]; then
            echo "::error::لم أجد ملف إعداد Gradle للتطبيق داخل android/app."
            exit 1
          fi

          echo "project_dir=$FOUND_PROJECT" >> "$GITHUB_OUTPUT"
          echo "تم العثور على المشروع: $FOUND_PROJECT"

      - name: Install JavaScript dependencies
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f npm-shrinkwrap.json ]]; then
            npm ci
          else
            echo "::warning::لا يوجد package-lock.json أو npm-shrinkwrap.json؛ سيتم استخدام npm install."
            npm install
          fi

      - name: Build release APK
        working-directory: ${{ steps.locate-project.outputs.project_dir }}/android
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect release APK files
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_SOURCE="android/app/build/outputs/apk/release"
          APK_DESTINATION="$GITHUB_WORKSPACE/apk-artifacts"

          if [[ ! -d "$APK_SOURCE" ]]; then
            echo "::error::لم يُنشأ مجلد APK الخاص بنسخة Release."
            exit 1
          fi

          mapfile -d '' APK_FILES < <(
            find "$APK_SOURCE" -type f -name '*.apk' -print0
          )

          if [[ "${#APK_FILES[@]}" -eq 0 ]]; then
            echo "::error::انتهى Gradle دون إنشاء أي ملف APK."
            exit 1
          fi

          mkdir -p "$APK_DESTINATION"

          for APK_FILE in "${APK_FILES[@]}"; do
            cp "$APK_FILE" "$APK_DESTINATION/"
            echo "تم تجهيز: $(basename "$APK_FILE")"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: munshe-release-apk
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
