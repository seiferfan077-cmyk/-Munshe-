name: Munshe Android APK Build

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "رابط مباشر لملف ZIP الخاص بمشروع React Native"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate project URL
        env:
          PROJECT_URL: ${{ inputs.project_url }}
        run: |
          set -euo pipefail
          if [[ ! "$PROJECT_URL" =~ ^https?:// ]]; then
            echo "Error: project_url must be an HTTP or HTTPS URL."
            exit 1
          fi

      - name: Download and extract project
        env:
          PROJECT_URL: ${{ inputs.project_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/munshe-project"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            "$PROJECT_URL" \
            --output "$RUNNER_TEMP/project.zip"

          unzip -q "$RUNNER_TEMP/project.zip" \
            -d "$RUNNER_TEMP/munshe-project"

          PROJECT_DIR="$RUNNER_TEMP/munshe-project"

          # يدعم ZIP بمجلد المشروع مباشرة أو داخل مجلد رئيسي واحد.
          if [[ ! -f "$PROJECT_DIR/package.json" ]]; then
            PACKAGE_JSON="$(find "$PROJECT_DIR" \
              -mindepth 2 -maxdepth 4 \
              -type f -name package.json -print -quit)"

            if [[ -z "$PACKAGE_JSON" ]]; then
              echo "Error: package.json was not found in the ZIP archive."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_JSON")"
          fi

          if [[ ! -d "$PROJECT_DIR/android" ]]; then
            echo "Error: android/ directory not found."
            echo "This workflow requires a React Native CLI project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "Warning: package-lock.json is missing; using npm install."
            npm install
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: munshe-app-release-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
