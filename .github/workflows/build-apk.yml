name: Build Expo Android APK

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: "رابط مستودع GitHub العام، مثل https://github.com/owner/project"
        required: true
        type: string
      ref:
        description: "اسم الفرع أو الوسم"
        required: true
        default: "main"
        type: string
      build_id:
        description: "معرّف عملية البناء في مُنشئ"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: munshe-build-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Parse and validate repository URL
        id: repository
        env:
          REPOSITORY_URL: ${{ inputs.repository_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlparse

          raw = os.environ["REPOSITORY_URL"].strip()
          parsed = urlparse(raw)

          if parsed.scheme != "https" or parsed.netloc.lower() != "github.com":
              print("::error::يجب أن يكون الرابط HTTPS لمستودع GitHub عام.")
              sys.exit(1)

          if parsed.query or parsed.fragment or parsed.username or parsed.password:
              print("::error::الرابط يجب ألا يحتوي على query أو بيانات دخول.")
              sys.exit(1)

          path = parsed.path.strip("/")
          if path.endswith(".git"):
              path = path[:-4]

          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", path):
              print("::error::صيغة الرابط يجب أن تكون https://github.com/owner/repository.")
              sys.exit(1)

          owner, repository = path.split("/", 1)
          normalized = f"{owner}/{repository}"
          print(f"repository={normalized}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={normalized}\n")
          PY

      - name: Check out source project
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repository.outputs.repository }}
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Expo project
        working-directory: source
        run: |
          set -euo pipefail
          test -f package.json || {
            echo "::error::لم أجد package.json في جذر المستودع."
            exit 1
          }
          node <<'NODE'
          const pkg = require('./package.json');
          const expo = pkg.dependencies?.expo || pkg.devDependencies?.expo;
          if (!expo) {
            console.error('::error::المشروع لا يحتوي على اعتماد expo.');
            process.exit(1);
          }
          NODE

      - name: Install JavaScript dependencies
        working-directory: source
        run: |
          set -euo pipefail
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile --ignore-scripts
          elif [[ -f yarn.lock ]]; then
            yarn install --frozen-lockfile --ignore-scripts
          elif [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Generate Android project with Expo prebuild
        working-directory: source
        run: |
          set -euo pipefail
          npx --no-install expo prebuild \
            --platform android \
            --non-interactive \
            --no-install

      - name: Build Debug APK with Gradle
        working-directory: source/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache assembleDebug

      - name: Collect APK
        working-directory: source
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          APK_SOURCE="android/app/build/outputs/apk/debug"
          APK_DESTINATION="$GITHUB_WORKSPACE/apk-artifacts"
          APK_FILE="${APK_DESTINATION}/munshe-${BUILD_ID}.apk"

          mkdir -p "$APK_DESTINATION"
          SOURCE_FILE="$(find "$APK_SOURCE" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$SOURCE_FILE" || ! -s "$SOURCE_FILE" ]]; then
            echo "::error::لم ينتج Gradle أي ملف Debug APK."
            exit 1
          fi

          cp "$SOURCE_FILE" "$APK_FILE"
          ls -lh "$APK_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: munshe-apk-${{ inputs.build_id }}
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
